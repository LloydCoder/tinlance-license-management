      responses:
        '200':
          description: Allocation released or idempotently replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseAllocationResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'

components:
  securitySchemes:
    AdminSession:
      type: apiKey
      in: cookie
      name: tlms_session
      description: Secure HttpOnly session cookie; browser mutations require CSRF token.
    AdminApiToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Scoped, revocable token; stored hashed server-side.
    SdkInstallation:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Product/install-bound machine credential; not a human admin token.
    ProviderSignature:
      type: apiKey
      in: header
      name: X-Provider-Signature
      description: Provider-specific signature scheme; verify raw request bytes and provider-specific timestamp headers.
    MonitorToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    LicenceId:
      name: licenceId
      in: path
      required: true
      schema:
        type: string
    Provider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_-]{1,63}$'
  schemas:
    Health:
      type: object
      required: [status, request_id]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        request_id:
          type: string
    CurrentActor:
      type: object
      required: [id, actor_type, permissions, request_id]
      properties:
        id:
          type: string
        actor_type:
          type: string
          enum: [human, api_token, sdk_installation, system]
        permissions:
          type: array
          items:
            type: string
        request_id:
          type: string
    Product:
      type: object
      required: [id, public_id, name, slug, description, status, version, created_at, updated_at]
      properties:
        id:
          type: string
          minLength: 26
          maxLength: 26
        public_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 2
          maxLength: 160
        slug:
          type: string
          minLength: 2
          maxLength: 80
        description:
          type: [string, 'null']
          maxLength: 2000
        status:
          type: string
          enum: [draft, active, suspended, retired]
        version:
          type: integer
          minimum: 1
        created_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time
    ProductCreateRequest:
      type: object
      required: [name, slug, reason]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 160
        slug:
          type: string
          minLength: 2
          maxLength: 80
        description:
          type: [string, 'null']
          maxLength: 2000
        reason:
          type: string
          minLength: 5
          maxLength: 500
    ProductUpdateRequest:
      type: object
      required: [expected_version, name, slug, description, reason]
      additionalProperties: false
      properties:
        expected_version:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 2
          maxLength: 160
        slug:
          type: string
          minLength: 2
          maxLength: 80
        description:
          type: [string, 'null']
          maxLength: 2000
        reason:
          type: string
          minLength: 5
          maxLength: 500
    ProductResult:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: '#/components/schemas/Product'
        request_id:
          type: string
    ProductCollection:
      type: object
      required: [data, meta, request_id]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        meta:
          $ref: '#/components/schemas/Pagination'
        request_id:
          type: string
    ReleaseChannelCreateRequest:
      type: object
      required: [slug, name, reason]
      additionalProperties: false
      properties:
        slug:
          type: string
          minLength: 2
          maxLength: 32
          pattern: '^[a-z][a-z0-9-]{1,31}$'
        name:
          type: string
          minLength: 2
          maxLength: 100
        reason:
          type: string
          minLength: 5
          maxLength: 500
    ReleaseChannelPromoteRequest:
      type: object
      required: [product_version_id, expected_version, reason]
      additionalProperties: false
      properties:
        product_version_id:
          type: string
          minLength: 26
          maxLength: 26
        expected_version:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 5
          maxLength: 500
    ReleaseChannel:
      type: object
      required: [id, product_id, slug, name, status, current_product_version_id, version_number, created_at, updated_at]
      properties:
        id:
          type: string
          minLength: 26
          maxLength: 26
        product_id:
          type: string
          minLength: 26
          maxLength: 26
        slug:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active]
        current_product_version_id:
          type: [string, 'null']
          minLength: 26
          maxLength: 26
        version_number:
          type: integer
          minimum: 1
        created_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time
    ReleaseChannelResult:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: '#/components/schemas/ReleaseChannel'
        request_id:
          type: string
    ReleaseChannelCollection:
      type: object
      required: [data, meta, request_id]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReleaseChannel'
        meta:
          $ref: '#/components/schemas/Pagination'
        request_id:
          type: string
    ReleaseChannelPromotionResult:
      type: object
      required: [data, meta, request_id]
      properties:
        data:
          $ref: '#/components/schemas/ReleaseChannel'
        meta:
          type: object
          required: [already_promoted]
          properties:
            already_promoted:
              type: boolean
        request_id:
          type: string
    ProductVersionCreateRequest:
      type: object
      required: [version, reason]
      additionalProperties: false
      properties:
        version:
          type: string
          maxLength: 64
          description: Semantic version identifier; validated by the API.
        release_notes:
          type: [string, 'null']
          maxLength: 5000
        artifact_sha256:
          type: [string, 'null']
          pattern: '^[a-fA-F0-9]{64}$'
        artifact_size_bytes:
          type: [integer, 'null']
          minimum: 1
        reason:
          type: string
          minLength: 5
          maxLength: 500
    ProductVersionUpdateRequest:
      type: object
      required: [expected_version, release_notes, artifact_sha256, artifact_size_bytes, reason]
      additionalProperties: false
      properties:
        expected_version:
          type: integer
          minimum: 1
        release_notes:
          type: [string, 'null']
          maxLength: 5000
        artifact_sha256:
          type: [string, 'null']
          pattern: '^[a-fA-F0-9]{64}$'
        artifact_size_bytes:
          type: [integer, 'null']
          minimum: 1
        reason:
          type: string
          minLength: 5
          maxLength: 500
    ProductVersionPublishRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 5
          maxLength: 500
    ProductVersion:
      type: object
      required: [id, product_id, version, status, version_number, published_at, created_at, updated_at]
      properties:
        id:
          type: string
          minLength: 26
          maxLength: 26
