openapi: 3.1.1
info:
  title: TLMS API
  version: 1.0.0
  summary: Vendor-operated software licensing and entitlement API
  description: >
    TLMS API contract. Identity and membership invitation operations are implemented;
    other paths may represent planned capabilities. Each operation describes its
    current guarantees. All production operations require HTTPS.
servers:
  - url: https://licenses.example-vendor.com/api/v1
    description: Vendor-managed TLMS installation (example only)
tags:
  - name: Health
  - name: Identity
  - name: Products
  - name: Licences
  - name: Integrations
  - name: Payments
  - name: Audit
security:
  - AdminSession: []
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: liveness
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /health/ready:
    get:
      tags: [Health]
      operationId: readiness
      security:
        - MonitorToken: []
      responses:
        '200':
          description: Dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /me:
    get:
      tags: [Identity]
      operationId: getCurrentActor
      responses:
        '200':
          description: Current authenticated actor and permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentActor'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /security/step-up/totp:
    post:
      tags: [Identity]
      operationId: createTotpStepUp
      summary: Verify a fresh TOTP factor for privileged session assurance
      description: Requires an authenticated, email-verified current browser session, recent password confirmation and an enrolled TOTP factor. Fortify verifies codes and caches accepted codes to reject reuse. Passkey users complete the existing /passkeys/confirm WebAuthn ceremony; successful authenticated passkey verification also establishes the step-up session marker.
      security:
        - AdminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaTotpStepUpRequest'
      responses:
        '200':
          description: Fresh TOTP assurance recorded for the configured five-minute window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaStepUpResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'
  /vendor-accounts/{vendorId}/memberships/{membershipId}/role-approval-requests:
    post:
      tags: [Identity]
      operationId: requestVendorRoleApproval
      summary: Request a maker-checker approval for a high-risk vendor role grant
      description: Creates a pending approval request for finance_admin, vendor_product_manager or reseller_manager. The role is not assigned until a different active vendor super administrator with approvals.review and admins.manage approves it. Requires fresh MFA step-up and an Idempotency-Key header.
      security:
        - AdminSession: []
      parameters:
        - name: vendorId
          in: path
          required: true
          schema:
            type: string
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: '^[A-Za-z0-9._:-]{16,128}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorRoleApprovalRequest'
      responses:
        '202':
          description: Approval request created; no membership role mutation has occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequestResult'
        '200':
          description: Idempotent replay of an existing request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequestResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Idempotency key conflict or an existing pending request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'
  /vendor-accounts/{vendorId}/role-approval-requests:
    get:
      tags: [Identity]
      operationId: listVendorRoleApprovalRequests
      summary: List vendor role approval requests
      description: Checkers with approvals.review and admins.manage can view all vendor requests. An admin without approval-review permission can view only requests they created. Results are vendor-scoped and paginated at 25 items.
      security:
        - AdminSession: []
      parameters:
        - name: vendorId
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected, expired, all]
            default: pending
      responses:
        '200':
          description: Vendor-scoped approval inbox
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequestListResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'
  /vendor-accounts/{vendorId}/role-approval-requests/{approvalRequestId}:
    get:
      tags: [Identity]
      operationId: showVendorRoleApprovalRequest
      summary: Show a vendor role approval request
      description: The maker may view their own request; other viewers require approval-review and admin permissions in the same vendor scope. Expired pending requests are transitioned to expired when read.
      security:
        - AdminSession: []
      parameters:
        - name: vendorId
          in: path
          required: true
          schema:
            type: string
        - name: approvalRequestId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Approval request detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequestResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'
  /vendor-accounts/{vendorId}/role-approval-requests/{approvalRequestId}/approve:
    post:
      tags: [Identity]
      operationId: approveVendorRoleApprovalRequest
      summary: Approve a high-risk vendor role grant
      description: Requires a different active user in the same vendor with approvals.review and admins.manage, a fresh MFA step-up, and an unexpired pending request whose payload hash is intact. The checker is recorded as the role-change actor.
      security:
        - AdminSession: []
      parameters:
        - name: vendorId
          in: path
          required: true
          schema:
            type: string
        - name: approvalRequestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionRequest'
      responses:
        '200':
          description: Request approved and role grant applied, or idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequestResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Request is no longer pending or payload integrity failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: Approval request expired before decision
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'
  /vendor-accounts/{vendorId}/role-approval-requests/{approvalRequestId}/reject:
    post:
      tags: [Identity]
      operationId: rejectVendorRoleApprovalRequest
      summary: Reject a high-risk vendor role grant
      description: Requires a different active user in the same vendor with approvals.review and admins.manage and a fresh MFA step-up. Rejection never mutates the target membership.
      security:
        - AdminSession: []
      parameters:
        - name: vendorId
          in: path
          required: true
          schema:
            type: string
        - name: approvalRequestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionRequest'
      responses:
        '200':
          description: Request rejected, or idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequestResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Request is no longer pending
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: Approval request expired before decision
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'
  /vendor-accounts/{vendorId}/memberships/{membershipId}/revoke:
    post:
      tags: [Identity]
      operationId: revokeVendorMembership
      summary: Revoke a vendor membership
      description: Revokes an active or invited membership in the vendor path. Requires a verified current session, recent password confirmation, enrolled MFA, fresh five-minute TOTP/passkey step-up and vendor-scoped admins.manage permission. Actors cannot revoke their own membership. Role grants and history are retained; authorization immediately denies the revoked membership.
      security:
        - AdminSession: []
      parameters:
        - name: vendorId
          in: path
          required: true
          schema:
            type: string
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipLifecycleChangeRequest'
      responses:
        '200':
          description: Membership revocation result; repeated requests do not create duplicate lifecycle events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipLifecycleChangeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          description: Fresh MFA step-up is required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /vendor-accounts/{vendorId}/memberships/invitations:
    post:
      tags: [Identity]
      operationId: inviteVendorMember
      summary: Invite a user to a vendor account
      description: Requires vendor-scoped admins.manage, recent password confirmation, enrolled MFA and fresh five-minute TOTP/passkey step-up. Creates an unverified account when the email is new, or binds an existing active account to the exact invited email. Only directly assignable low-risk roles are accepted; privileged roles remain behind maker-checker. The 256-bit invitation secret is stored as SHA-256, delivered in a URL fragment, single-use and expires after the configured lifetime. Public registration remains disabled.
      security:
        - AdminSession: []
      parameters:
        - name: vendorId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipInvitationRequest'
      responses:
        '201':
          description: Invited membership created and email delivery completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipInvitationResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A membership already exists for this account and vendor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Invitation record was created but email delivery failed; retry with the resend operation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /vendor-accounts/{vendorId}/memberships/{membershipId}/invitation/resend:
    post:
      tags: [Identity]
      operationId: resendVendorMembershipInvitation
      summary: Rotate and resend a pending vendor membership invitation
      description: Requires vendor-scoped admins.manage and fresh MFA step-up. Only an invited membership can be resent. All previous pending tokens are revoked before a new token is issued; accepted or revoked memberships cannot be resent.
      security:
        - AdminSession: []
      parameters:
        - name: vendorId
          in: path
          required: true
          schema:
            type: string
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipInvitationResendRequest'
      responses:
        '200':
          description: A new invitation token was issued and delivered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipInvitationResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Invitation record was created but email delivery failed; retry with the resend operation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /vendor-accounts/{vendorId}/memberships/{membershipId}/roles/{roleId}:
    post:
      tags: [Identity]
      operationId: assignVendorMembershipRole
      summary: Assign an allowlisted role to a vendor member
      description: Requires a verified browser session, current session version, recent password confirmation, fresh MFA step-up within five minutes and the vendor-scoped admins.manage permission. Direct assignment is limited to low-risk roles; finance_admin, vendor_product_manager and reseller_manager grants must use the maker-checker approval flow. The target membership must belong to the vendor in the path.
      security:
        - AdminSession: []
      parameters:
        - name: vendorId
          in: path
          required: true
          schema:
            type: string
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
        - name: roleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipRoleChangeRequest'
      responses:
        '201':
          description: Role assigned and immutable membership-role event recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipRoleChangeResult'
        '200':
          description: Assignment was already present; no duplicate event was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipRoleChangeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'
  /vendor-accounts/{vendorId}/memberships/{membershipId}/roles/{roleId}/revoke:
    post:
      tags: [Identity]
      operationId: revokeVendorMembershipRole
      summary: Revoke an allowlisted role from a vendor member
      description: Requires the same verified, current, password-confirmed vendor administrator session and fresh MFA step-up as assignment. The target membership must belong to the vendor in the path.
      security:
        - AdminSession: []
      parameters:
        - name: vendorId
          in: path
          required: true
          schema:
            type: string
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
        - name: roleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipRoleChangeRequest'
      responses:
        '200':
          description: Role revocation result and immutable membership-role event when changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipRoleChangeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'
  /customer-organizations/{organizationId}/memberships/{membershipId}/revoke:
    post:
      tags: [Identity]
      operationId: revokeCustomerMembership
      summary: Revoke a customer organization membership
      description: Revokes an active or invited membership in the organization path. Requires a verified current session, recent password confirmation, enrolled MFA, fresh five-minute TOTP/passkey step-up and customer.members.manage permission. Actors cannot revoke their own membership. Role grants and history are retained; authorization immediately denies the revoked membership.
      security:
        - AdminSession: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipLifecycleChangeRequest'
      responses:
        '200':
          description: Membership revocation result; repeated requests do not create duplicate lifecycle events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipLifecycleChangeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          description: Fresh MFA step-up is required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /customer-organizations/{organizationId}/memberships/invitations:
    post:
      tags: [Identity]
      operationId: inviteCustomerMember
      summary: Invite a user to a customer organization
      description: Requires customer.members.manage, recent password confirmation, enrolled MFA and fresh five-minute TOTP/passkey step-up. Creates an unverified account when the email is new, or binds an existing active account to the exact invited email. Direct role assignment is limited to customer roles allowed by the authorization service. The 256-bit invitation secret is stored as SHA-256, delivered in a URL fragment, single-use and expires after the configured lifetime.
      security:
        - AdminSession: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipInvitationRequest'
      responses:
        '201':
          description: Invited membership created and email delivery completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipInvitationResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A membership already exists for this account and organization
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Invitation record was created but email delivery failed; retry with the resend operation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /customer-organizations/{organizationId}/memberships/{membershipId}/invitation/resend:
    post:
      tags: [Identity]
      operationId: resendCustomerMembershipInvitation
      summary: Rotate and resend a pending customer membership invitation
      description: Requires customer.members.manage and fresh MFA step-up. Only an invited membership can be resent. All previous pending tokens are revoked before a new token is issued; accepted or revoked memberships cannot be resent.
      security:
        - AdminSession: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipInvitationResendRequest'
      responses:
        '200':
          description: A new invitation token was issued and delivered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipInvitationResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Invitation record was created but email delivery failed; retry with the resend operation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /customer-organizations/{organizationId}/memberships/{membershipId}/roles/{roleId}:
    post:
      tags: [Identity]
      operationId: assignCustomerMembershipRole
      summary: Assign an allowlisted role to a customer organization member
      description: Requires a verified browser session, current session version, recent password confirmation, fresh MFA step-up within five minutes and the customer.members.manage permission. The target membership must belong to the organization in the path.
      security:
        - AdminSession: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
        - name: roleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipRoleChangeRequest'
      responses:
        '201':
          description: Role assigned and immutable membership-role event recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipRoleChangeResult'
        '200':
          description: Assignment was already present; no duplicate event was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipRoleChangeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'
  /customer-organizations/{organizationId}/memberships/{membershipId}/roles/{roleId}/revoke:
    post:
      tags: [Identity]
      operationId: revokeCustomerMembershipRole
      summary: Revoke an allowlisted role from a customer organization member
      description: Requires the same verified, current, password-confirmed customer owner session and fresh MFA step-up as assignment. The target membership must belong to the organization in the path.
      security:
        - AdminSession: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
        - name: roleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipRoleChangeRequest'
      responses:
        '200':
          description: Role revocation result and immutable membership-role event when changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipRoleChangeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'
  /products:
    get:
      tags: [Products]
      operationId: listProducts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Product collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /licences:
    post:
      tags: [Licences]
      operationId: issueLicence
      security:
        - AdminSession: []
        - AdminApiToken: [licences.issue]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueLicenceRequest'
      responses:
        '201':
          description: Licence issued; plaintext key is returned only once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedLicence'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /licences/{licenceId}:
    get:
      tags: [Licences]
      operationId: getLicence
      parameters:
        - $ref: '#/components/parameters/LicenceId'
      responses:
        '200':
          description: Licence metadata; never returns original licence key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Licence'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /activations:
    post:
      tags: [Licences]
      operationId: activateInstallation
      security:
        - SdkInstallation: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivationRequest'
      responses:
        '201':
          description: Activation accepted and signed lease issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /activations/verify:
    post:
      tags: [Licences]
      operationId: verifyInstallation
      security:
        - SdkInstallation: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
      responses:
        '200':
          description: Current verification result and optional refreshed lease
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/integrations/{provider}/credentials:
    get:
      tags: [Integrations]
      operationId: listCredentialMetadata
      parameters:
        - $ref: '#/components/parameters/Provider'
      responses:
        '200':
          description: Credential metadata only; secret material is never returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Integrations]
      operationId: stageProviderCredential
      parameters:
        - $ref: '#/components/parameters/Provider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageCredentialRequest'
      responses:
        '201':
          description: Credential staged; response contains metadata only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialMetadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/integrations/{provider}/credentials/{credentialId}/test:
    post:
      tags: [Integrations]
      operationId: testProviderCredential
      parameters:
        - $ref: '#/components/parameters/Provider'
        - name: credentialId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Safe validation result; no credential values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialTestResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/integrations/{provider}/credentials/{credentialId}/activate:
    post:
      tags: [Integrations]
      operationId: activateProviderCredential
      parameters:
        - $ref: '#/components/parameters/Provider'
        - name: credentialId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Credential version activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialMetadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /webhooks/payments/{provider}:
    post:
      tags: [Payments]
      operationId: receivePaymentWebhook
      security:
        - ProviderSignature: []
      parameters:
        - $ref: '#/components/parameters/Provider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Verified event durably accepted for idempotent processing
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/audit-events:
    get:
      tags: [Audit]
      operationId: listAuditEvents
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Authorized, redacted audit events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    AdminSession:
      type: apiKey
      in: cookie
      name: tlms_session
      description: Secure HttpOnly session cookie; browser mutations require CSRF token.
    AdminApiToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Scoped, revocable token; stored hashed server-side.
    SdkInstallation:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Product/install-bound machine credential; not a human admin token.
    ProviderSignature:
      type: apiKey
      in: header
      name: X-Provider-Signature
      description: Provider-specific signature scheme; verify raw request bytes and provider-specific timestamp headers.
    MonitorToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    LicenceId:
      name: licenceId
      in: path
      required: true
      schema:
        type: string
    Provider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_-]{1,63}$'
  schemas:
    Health:
      type: object
      required: [status, request_id]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        request_id:
          type: string
    CurrentActor:
      type: object
      required: [id, actor_type, permissions, request_id]
      properties:
        id:
          type: string
        actor_type:
          type: string
          enum: [human, api_token, sdk_installation, system]
        permissions:
          type: array
          items:
            type: string
        request_id:
          type: string
    Product:
      type: object
      required: [id, name, slug, status]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [draft, active, suspended, retired]
    ProductCollection:
      type: object
      required: [data, meta, request_id]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        meta:
          $ref: '#/components/schemas/Pagination'
        request_id:
          type: string
    Pagination:
      type: object
      required: [page, per_page, total]
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
    IssueLicenceRequest:
      type: object
      additionalProperties: false
      required: [customer_organization_id, product_id, plan_version_id, term]
      properties:
        customer_organization_id:
          type: string
        product_id:
          type: string
        plan_version_id:
          type: string
        term:
          type: string
          enum: [trial, monthly, annual, perpetual, custom]
        grant_reason:
          type: string
          maxLength: 500
    IssuedLicence:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [id, public_reference, status, licence_key]
          properties:
            id:
              type: string
            public_reference:
              type: string
            status:
              type: string
            licence_key:
              type: string
              description: Server-generated key shown once in this creation response only; never stored or retrievable.
        request_id:
          type: string
    Licence:
      type: object
      required: [id, public_reference, product_id, status, version]
      properties:
        id:
          type: string
        public_reference:
          type: string
        product_id:
          type: string
        status:
          type: string
          enum: [pending, active, grace, expired, suspended, revoked, transferred, replaced]
        version:
          type: integer
        expires_at:
          type: [string, 'null']
          format: date-time
    ActivationRequest:
      type: object
      additionalProperties: false
      required: [product_public_id, licence_key, domain, installation_id, nonce, sdk_version]
      properties:
        product_public_id:
          type: string
        licence_key:
          type: string
          writeOnly: true
        domain:
          type: string
        installation_id:
          type: string
        nonce:
          type: string
        sdk_version:
          type: string
        environment:
          type: string
          enum: [production, staging, development]
    ActivationResult:
      type: object
      required: [activation_id, status, lease, request_id]
      properties:
        activation_id:
          type: string
        status:
          type: string
          enum: [active, already_active]
        lease:
          type: string
          description: Signed versioned lease; validate with pinned public signing keys.
        request_id:
          type: string
    VerifyRequest:
      type: object
      additionalProperties: false
      required: [installation_id, lease, nonce]
      properties:
        installation_id:
          type: string
        lease:
          type: string
        nonce:
          type: string
    VerifyResult:
      type: object
      required: [valid, status, request_id]
      properties:
        valid:
          type: boolean
        status:
          type: string
          enum: [active, grace, expired, suspended, revoked, unknown]
        refreshed_lease:
          type: [string, 'null']
        request_id:
          type: string
    StageCredentialRequest:
      type: object
      additionalProperties: false
      required: [environment, credential_fields]
      properties:
        environment:
          type: string
          enum: [test, live]
        credential_fields:
          type: object
          writeOnly: true
          additionalProperties:
            type: string
            writeOnly: true
    CredentialMetadata:
      type: object
      required: [id, provider, environment, status, version, configured]
      properties:
        id:
          type: string
        provider:
          type: string
        environment:
          type: string
        status:
          type: string
          enum: [draft, validated, active, disabled, invalid]
        version:
          type: integer
        configured:
          type: boolean
        masked_suffix:
          type: [string, 'null']
        last_validated_at:
          type: [string, 'null']
          format: date-time
    CredentialCollection:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CredentialMetadata'
        request_id:
          type: string
    CredentialTestResult:
      type: object
      required: [valid, checked_at, request_id]
      properties:
        valid:
          type: boolean
        checked_at:
          type: string
          format: date-time
        message:
          type: string
          description: Normalized non-sensitive diagnostic.
        request_id:
          type: string
    AuditEvent:
      type: object
      required: [id, actor_type, action, target_type, occurred_at, outcome]
      properties:
        id:
          type: string
        actor_type:
          type: string
        actor_id:
          type: [string, 'null']
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: [string, 'null']
        occurred_at:
          type: string
          format: date-time
        outcome:
          type: string
          enum: [success, denied, failure]
    AuditCollection:
      type: object
      required: [data, meta, request_id]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        meta:
          $ref: '#/components/schemas/Pagination'
        request_id:
          type: string
    MfaTotpStepUpRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Current six-digit TOTP code. Recovery codes are not accepted for step-up.
    MfaStepUpResult:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [method, stepped_up_at, expires_at, expires_in]
          properties:
            method:
              type: string
              enum: [totp]
            stepped_up_at:
              type: integer
              format: int64
            expires_at:
              type: integer
              format: int64
            expires_in:
              type: integer
              minimum: 1
        request_id:
          type: string
    VendorRoleApprovalRequest:
      type: object
      additionalProperties: false
      required: [role_id, reason]
      properties:
        role_id:
          type: string
          description: ULID for finance_admin, vendor_product_manager or reseller_manager.
        reason:
          type: string
          minLength: 1
          maxLength: 500
    ApprovalDecisionRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Human-readable checker decision rationale.
    ApprovalRequest:
      type: object
      additionalProperties: false
      required: [id, status, action, membership_id, target_user_id, target_user_name, role_id, role_slug, requested_by_user_id, reason, expires_at]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected, expired]
        action:
          type: string
          enum: [vendor_role.assign]
        membership_id:
          type: string
        target_user_id:
          type: string
        target_user_name:
          type: string
        role_id:
          type: string
        role_slug:
          type: string
          enum: [finance_admin, vendor_product_manager, reseller_manager]
        requested_by_user_id:
          type: string
        decided_by_user_id:
          type: [string, 'null']
        reason:
          type: string
        decision_reason:
          type: [string, 'null']
        expires_at:
          type: string
          format: date-time
        decided_at:
          type: [string, 'null']
          format: date-time
    ApprovalRequestResult:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          $ref: '#/components/schemas/ApprovalRequest'
        request_id:
          type: string
    ApprovalRequestListResult:
      type: object
      additionalProperties: false
      required: [data, meta, request_id]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalRequest'
        meta:
          type: object
          additionalProperties: false
          required: [current_page, last_page, per_page, total]
          properties:
            current_page:
              type: integer
            last_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
        request_id:
          type: string
    MembershipInvitationRequest:
      type: object
      additionalProperties: false
      required: [email, role_slug, reason]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        name:
          type: [string, 'null']
          minLength: 2
          maxLength: 160
        role_slug:
          type: string
          maxLength: 100
        reason:
          type: string
          minLength: 5
          maxLength: 500
    MembershipInvitationResendRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 5
          maxLength: 500
    MembershipInvitationResult:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [membership_id, status, invitation_expires_at]
          properties:
            membership_id:
              type: string
            status:
              type: string
              enum: [invited]
            invitation_expires_at:
              type: string
              format: date-time
    MembershipLifecycleChangeRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Human-readable reason stored in immutable membership lifecycle evidence.
    MembershipLifecycleChangeResult:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [membership_id, status, changed]
          properties:
            membership_id:
              type: string
            status:
              type: string
              enum: [revoked]
            changed:
              type: boolean
        request_id:
          type: string
    MembershipRoleChangeRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Human-readable business justification stored in immutable role-event evidence.
    MembershipRoleChangeResult:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [membership_id, role_id, action, changed]
          properties:
            membership_id:
              type: string
            role_id:
              type: string
            action:
              type: string
              enum: [assigned, revoked]
            changed:
              type: boolean
        request_id:
          type: string
    Problem:
      type: object
      required: [type, title, status, code, request_id]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        request_id:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated actor is not authorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found in caller scope
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: State or idempotency conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: Request validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Locked:
      description: Recent password confirmation or fresh MFA step-up is missing or expired
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Request rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Service is not ready
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
