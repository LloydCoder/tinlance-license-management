          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Invitation record was created but email delivery failed; retry with the resend operation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /customer-organizations/{organizationId}/memberships/{membershipId}/invitation/resend:
    post:
      tags: [Identity]
      operationId: resendCustomerMembershipInvitation
      summary: Rotate and resend a pending customer membership invitation
      description: Requires customer.members.manage and fresh MFA step-up. Only an invited membership can be resent. All previous pending tokens are revoked before a new token is issued; accepted or revoked memberships cannot be resent.
      security:
        - AdminSession: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipInvitationResendRequest'
      responses:
        '200':
          description: A new invitation token was issued and delivered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipInvitationResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Invitation record was created but email delivery failed; retry with the resend operation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /customer-organizations/{organizationId}/memberships/{membershipId}/reinstate:
    post:
      tags: [Identity]
      operationId: reinstateCustomerMembership
      summary: Reinstate a revoked customer membership through a new invitation
      description: Requires customer.members.manage, recent password confirmation, enrolled MFA and fresh five-minute TOTP/passkey step-up. Only a revoked membership with an active target account and active parent organization/vendor can be reinstated. Previous roles are revoked with immutable role-event evidence, a new allowlisted customer role is assigned, the membership returns to invited, all prior invitation tokens remain revoked, and a fresh single-use invitation token is emailed. The raw token is never returned by the API.
      security:
        - AdminSession: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipReinstatementRequest'
      responses:
        '201':
          description: Membership moved from revoked to invited and a fresh invitation delivered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipInvitationResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Membership is not currently revoked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Membership reinstatement committed but invitation email delivery failed; resend the new invitation after correcting mail transport
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
