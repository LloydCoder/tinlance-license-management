openapi: 3.1.1
info:
  title: TLMS API
  version: 1.0.0
  summary: Vendor-operated software licensing and entitlement API
  description: >
    TLMS API contract. Identity and membership invitation operations are implemented;
    other paths may represent planned capabilities. Each operation describes its
    current guarantees. All production operations require HTTPS.
servers:
  - url: https://licenses.example-vendor.com/api/v1
    description: Vendor-managed TLMS installation (example only)
tags:
  - name: Health
  - name: Identity
  - name: Products
  - name: Licences
  - name: Integrations
  - name: Payments
  - name: Audit
security:
  - AdminSession: []
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: liveness
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /health/ready:
    get:
      tags: [Health]
      operationId: readiness
      security:
        - MonitorToken: []
      responses:
        '200':
          description: Dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /me:
    get:
      tags: [Identity]
      operationId: getCurrentActor
      responses:
        '200':
          description: Current authenticated actor and permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentActor'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /security/step-up/totp:
    post:
      tags: [Identity]
      operationId: createTotpStepUp
      summary: Verify a fresh TOTP factor for privileged session assurance
      description: Requires an authenticated, email-verified current browser session, recent password confirmation and an enrolled TOTP factor. Fortify verifies codes and caches accepted codes to reject reuse. Passkey users complete the existing /passkeys/confirm WebAuthn ceremony; successful authenticated passkey verification also establishes the step-up session marker.
      security:
        - AdminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaTotpStepUpRequest'
      responses:
        '200':
          description: Fresh TOTP assurance recorded for the configured five-minute window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaStepUpResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'
  /products/{productId}/versions:
    parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          minLength: 26
          maxLength: 26
    get:
      tags: [Products]
      operationId: listProductVersions
      description: Lists versions for a product the active vendor membership may read. Product managers and developers see versions only for assigned products; vendor Super Admins see all products in their vendor account.
      responses:
        '200':
          description: Product versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductVersionCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [Products]
      operationId: createProductVersion
      description: Creates a draft semantic version for an assigned product. Requires plans.entitlements.manage, recent password confirmation and fresh MFA step-up. Version identity is unique per product.
      security:
        - AdminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductVersionCreateRequest'
      responses:
        '201':
          description: Draft product version created with immutable audit evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductVersionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'
  /products/{productId}/versions/{productVersionId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          minLength: 26
          maxLength: 26
      - name: productVersionId
        in: path
        required: true
        schema:
          type: string
          minLength: 26
          maxLength: 26
    get:
      tags: [Products]
      operationId: getProductVersion
      responses:
        '200':
          description: Product version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductVersionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Products]
      operationId: updateProductVersion
      description: Updates draft release notes and artifact metadata using optimistic version control. Published versions are immutable. Requires plans.entitlements.manage and fresh MFA step-up.
      security:
        - AdminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductVersionUpdateRequest'
      responses:
        '200':
          description: Draft product version updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductVersionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'
  /products/{productId}/versions/{productVersionId}/publish:
    post:
      tags: [Products]
      operationId: publishProductVersion
      description: Publishes a draft version only after a valid SHA-256 artifact digest and positive artifact size are recorded. Requires releases.publish, recent password confirmation and fresh MFA step-up. Published metadata is immutable.
      security:
        - AdminSession: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            minLength: 26
            maxLength: 26
        - name: productVersionId
          in: path
          required: true
          schema:
            type: string
            minLength: 26
            maxLength: 26
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductVersionPublishRequest'
      responses:
        '200':
          description: Product version published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductVersionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'
  /products/{productId}/release-channels:
    parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          minLength: 26
          maxLength: 26
    get:
      tags: [Products]
      operationId: listReleaseChannels
      description: Lists release channels for a product the active vendor membership may read. Assigned developers have read-only access.
      responses:
        '200':
          description: Release channels
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseChannelCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [Products]
      operationId: createReleaseChannel
      description: Creates an active product-scoped release channel. Requires plans.entitlements.manage, recent password confirmation and fresh MFA step-up. Channel slugs are unique per product.
      security:
        - AdminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseChannelCreateRequest'
      responses:
        '201':
          description: Release channel created with immutable audit evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseChannelResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'
  /products/{productId}/release-channels/{releaseChannelId}/promote:
    parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          minLength: 26
          maxLength: 26
      - name: releaseChannelId
        in: path
        required: true
        schema:
          type: string
          minLength: 26
          maxLength: 26
    post:
      tags: [Products]
      operationId: promoteReleaseChannel
      description: Promotes a published version of the same product to the channel. Requires releases.publish, expected_version optimistic locking, a reason and fresh MFA step-up. Repeating the current promotion is idempotent; promoting an earlier published version supports controlled rollback.
      security:
        - AdminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseChannelPromoteRequest'
      responses:
        '200':
          description: Release channel promotion completed or already current
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseChannelPromotionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'
  /vendor-accounts/{vendorId}/memberships/{membershipId}/role-approval-requests:
    post:
      tags: [Identity]
      operationId: requestVendorRoleApproval
      summary: Request a maker-checker approval for a high-risk vendor role grant
      description: Creates a pending approval request for finance_admin, vendor_product_manager or reseller_manager. The role is not assigned until a different active vendor super administrator with approvals.review and admins.manage approves it. Requires fresh MFA step-up and an Idempotency-Key header.
      security:
        - AdminSession: []
      parameters:
        - name: vendorId
          in: path
          required: true
          schema:
            type: string
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: '^[A-Za-z0-9._:-]{16,128}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorRoleApprovalRequest'
      responses:
        '202':
          description: Approval request created; no membership role mutation has occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequestResult'
        '200':
          description: Idempotent replay of an existing request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequestResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Idempotency key conflict or an existing pending request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'
  /vendor-accounts/{vendorId}/role-approval-requests:
    get:
      tags: [Identity]
      operationId: listVendorRoleApprovalRequests
      summary: List vendor role approval requests
      description: Checkers with approvals.review and admins.manage can view all vendor requests. An admin without approval-review permission can view only requests they created. Results are vendor-scoped and paginated at 25 items.
      security:
        - AdminSession: []
      parameters:
        - name: vendorId
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected, expired, all]
            default: pending
      responses:
        '200':
          description: Vendor-scoped approval inbox
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequestListResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'
  /vendor-accounts/{vendorId}/role-approval-requests/{approvalRequestId}:
    get:
      tags: [Identity]
      operationId: showVendorRoleApprovalRequest
      summary: Show a vendor role approval request
      description: The maker may view their own request; other viewers require approval-review and admin permissions in the same vendor scope. Expired pending requests are transitioned to expired when read.
      security:
        - AdminSession: []
      parameters:
        - name: vendorId
          in: path
          required: true
          schema:
            type: string
        - name: approvalRequestId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Approval request detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequestResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'
  /vendor-accounts/{vendorId}/role-approval-requests/{approvalRequestId}/approve:
    post:
      tags: [Identity]
      operationId: approveVendorRoleApprovalRequest
      summary: Approve a high-risk vendor role grant
      description: Requires a different active user in the same vendor with approvals.review and admins.manage, a fresh MFA step-up, and an unexpired pending request whose payload hash is intact. The checker is recorded as the role-change actor.
      security:
        - AdminSession: []
      parameters:
        - name: vendorId
          in: path
          required: true
          schema:
            type: string
        - name: approvalRequestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionRequest'
      responses:
        '200':
          description: Request approved and role grant applied, or idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequestResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Request is no longer pending or payload integrity failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: Approval request expired before decision
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'
  /vendor-accounts/{vendorId}/role-approval-requests/{approvalRequestId}/reject:
    post:
      tags: [Identity]
      operationId: rejectVendorRoleApprovalRequest
      summary: Reject a high-risk vendor role grant
      description: Requires a different active user in the same vendor with approvals.review and admins.manage and a fresh MFA step-up. Rejection never mutates the target membership.
      security:
        - AdminSession: []
      parameters:
        - name: vendorId
          in: path
          required: true
          schema:
            type: string
        - name: approvalRequestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionRequest'
      responses:
        '200':
          description: Request rejected, or idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequestResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Request is no longer pending
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: Approval request expired before decision
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'
  /vendor-accounts/{vendorId}/memberships/{membershipId}/revoke:
    post:
      tags: [Identity]
      operationId: revokeVendorMembership
      summary: Revoke a vendor membership
      description: Revokes an active or invited membership in the vendor path. Requires a verified current session, recent password confirmation, enrolled MFA, fresh five-minute TOTP/passkey step-up and vendor-scoped admins.manage permission. Actors cannot revoke their own membership. Role grants and history are retained; authorization immediately denies the revoked membership.
      security:
        - AdminSession: []
      parameters:
        - name: vendorId
          in: path
          required: true
          schema:
            type: string
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipLifecycleChangeRequest'
      responses:
        '200':
          description: Membership revocation result; repeated requests do not create duplicate lifecycle events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipLifecycleChangeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          description: Fresh MFA step-up is required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /vendor-accounts/{vendorId}/memberships/invitations:
    post:
      tags: [Identity]
      operationId: inviteVendorMember
      summary: Invite a user to a vendor account
      description: Requires vendor-scoped admins.manage, recent password confirmation, enrolled MFA and fresh five-minute TOTP/passkey step-up. Creates an unverified account when the email is new, or binds an existing active account to the exact invited email. Only directly assignable low-risk roles are accepted; privileged roles remain behind maker-checker. The 256-bit invitation secret is stored as SHA-256, delivered in a URL fragment, single-use and expires after the configured lifetime. Public registration remains disabled.
      security:
        - AdminSession: []
      parameters:
        - name: vendorId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipInvitationRequest'
      responses:
        '201':
          description: Invited membership created and email delivery completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipInvitationResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A membership already exists for this account and vendor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Invitation record was created but email delivery failed; retry with the resend operation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /vendor-accounts/{vendorId}/memberships/{membershipId}/invitation/resend:
    post:
      tags: [Identity]
      operationId: resendVendorMembershipInvitation
      summary: Rotate and resend a pending vendor membership invitation
      description: Requires vendor-scoped admins.manage and fresh MFA step-up. Only an invited membership can be resent. All previous pending tokens are revoked before a new token is issued; accepted or revoked memberships cannot be resent.
      security:
        - AdminSession: []
      parameters:
        - name: vendorId
          in: path
          required: true
          schema:
            type: string
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipInvitationResendRequest'
      responses:
        '200':
          description: A new invitation token was issued and delivered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipInvitationResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Invitation record was created but email delivery failed; retry with the resend operation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /vendor-accounts/{vendorId}/memberships/{membershipId}/reinstate:
    post:
      tags: [Identity]
      operationId: reinstateVendorMembership
      summary: Reinstate a revoked vendor membership through a new invitation
      description: Requires vendor-scoped admins.manage, recent password confirmation, enrolled MFA and fresh five-minute TOTP/passkey step-up. Only a revoked membership with an active target account can be reinstated. Previous roles are revoked with immutable role-event evidence, a new allowlisted low-risk role is assigned, the membership returns to invited, all prior invitation tokens remain revoked, and a fresh single-use invitation token is emailed. The raw token is never returned by the API. Protected super_admin/platform_admin role cleanup requires an acting vendor Super Admin.
      security:
        - AdminSession: []
      parameters:
        - name: vendorId
          in: path
          required: true
          schema:
            type: string
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipReinstatementRequest'
      responses:
        '201':
          description: Membership moved from revoked to invited and a fresh invitation delivered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipInvitationResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Membership is not currently revoked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Membership reinstatement committed but invitation email delivery failed; resend the new invitation after correcting mail transport
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /vendor-accounts/{vendorId}/memberships/{membershipId}/roles/{roleId}:
    post:
      tags: [Identity]
      operationId: assignVendorMembershipRole
      summary: Assign an allowlisted role to a vendor member
      description: Requires a verified browser session, current session version, recent password confirmation, fresh MFA step-up within five minutes and the vendor-scoped admins.manage permission. Direct assignment is limited to low-risk roles; finance_admin, vendor_product_manager and reseller_manager grants must use the maker-checker approval flow. The target membership must belong to the vendor in the path.
      security:
        - AdminSession: []
      parameters:
        - name: vendorId
          in: path
          required: true
          schema:
            type: string
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
        - name: roleId
          in: path
          required: true
          schema:
            type: string
