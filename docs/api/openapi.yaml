  /products/{productId}/licenses:
    parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          minLength: 26
          maxLength: 26
    post:
      tags: [Licences]
      operationId: issueProductLicence
      summary: Issue a product-scoped licence
      description: Requires licences.issue, an active vendor membership, product assignment (except vendor Super Admin), recent password confirmation and fresh MFA step-up. The idempotency token is SHA-256 hashed at rest and scoped to vendor and actor. The response never contains the plaintext licence key; retrieve it once through the secret-delivery endpoint.
      security:
        - AdminSession: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 32
            maxLength: 128
            pattern: '^[A-Za-z0-9._~-]{32,128}$'
        - name: X-Request-ID
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LicenseIssueRequest'
      responses:
        '201':
          description: Licence issued; secret retrieval is available for a limited time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseIssueResult'
        '200':
          description: Idempotent replay; no second licence is created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseIssueResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'
  /license-issuance-requests/{issuanceRequestId}/secret:
    parameters:
      - name: issuanceRequestId
        in: path
        required: true
        schema:
          type: string
          minLength: 26
          maxLength: 26
    post:
      tags: [Licences]
      operationId: revealIssuedLicenceSecret
      summary: Retrieve an issued licence key once
      description: Only the original issuing actor may retrieve the secret. Retrieval is protected by fresh MFA, bound to the vendor and issuance request, expires after the configured TTL, marks the request delivered atomically, clears ciphertext and emits an immutable licence event. The response is never cacheable.
      security:
        - AdminSession: []
      parameters:
        - name: X-Request-ID
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: One-time plaintext licence key delivered
          headers:
            Cache-Control:
              schema:
                type: string
                pattern: '(^|,\s*)no-store(,|$)'
            Pragma:
              schema:
                type: string
                const: no-cache
            Referrer-Policy:
              schema:
                type: string
                const: no-referrer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseSecretResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          description: The one-time secret was already delivered or its retrieval window expired
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'

  /licenses/{licenseId}/transitions:
    parameters:
      - name: licenseId
        in: path
        required: true
        schema:
          type: string
          minLength: 26
          maxLength: 26
    post:
      tags: [Licences]
      operationId: transitionLicenceLifecycle
      summary: Apply an authorized licence lifecycle transition
      description: Requires licences.mutate, an active vendor membership, product assignment (except vendor Super Admin), recent password confirmation and fresh MFA step-up. The X-Request-ID is vendor-scoped and idempotent. Every accepted transition locks the licence aggregate, increments its version exactly once and appends an immutable licence event in the same database transaction. User actions may activate, suspend or revoke; expiry is system-managed.
      security:
        - AdminSession: []
      parameters:
        - name: X-Request-ID
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LicenseLifecycleTransitionRequest'
      responses:
        '200':
          description: Lifecycle transition applied or idempotently replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseLifecycleTransitionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'


  /licenses/{licenseId}/renewals:
    parameters:
      - name: licenseId
        in: path
        required: true
        schema:
          type: string
          minLength: 26
          maxLength: 26
    post:
      tags: [Licences]
      operationId: renewLicence
      summary: Renew an active or suspended annual/subscription licence
      description: Requires licences.mutate, active vendor membership, product assignment (except vendor Super Admin), recent password confirmation and fresh MFA step-up. Renewal uses the immutable published plan version, extends from the current effective expiry, preserves the current lifecycle status and is idempotent by vendor-scoped X-Request-ID. The licence version and immutable renewal event are committed atomically.
      security:
        - AdminSession: []
      parameters:
        - name: X-Request-ID
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LicenseRenewalRequest'
      responses:
        '200':
          description: Renewal applied or idempotently replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseRenewalResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'


  /licenses/{licenseId}/allocations:
    parameters:
      - name: licenseId
        in: path
        required: true
        schema:
          type: string
          minLength: 26
          maxLength: 26
    post:
      tags: [Licences]
      operationId: allocateLicenceResource
      summary: Reserve a site, seat or user allocation against a licence
      description: Requires licences.mutate, active vendor membership, product assignment (except vendor Super Admin), recent password confirmation and fresh MFA step-up. The subject identifier is treated as an opaque identifier and is never persisted; its keyed fingerprint is stored with the licence pepper key identifier. The immutable published-plan entitlement limit is enforced under a licence row lock.
      security:
        - AdminSession: []
      parameters:
        - name: X-Request-ID
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LicenseAllocationRequest'
      responses:
        '201':
          description: Allocation created or reactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseAllocationResult'
        '200':
          description: Idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseAllocationResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/RateLimited'

  /licenses/{licenseId}/allocations/{allocationId}:
    parameters:
      - name: licenseId
        in: path
        required: true
        schema:
          type: string
          minLength: 26
          maxLength: 26
      - name: allocationId
        in: path
        required: true
        schema:
          type: string
          minLength: 26
          maxLength: 26
    delete:
      tags: [Licences]
      operationId: releaseLicenceResourceAllocation
      summary: Release a site, seat or user allocation
      description: Requires licences.mutate, active vendor membership, product assignment (except vendor Super Admin), recent password confirmation and fresh MFA step-up. Releases are versioned, idempotent and append immutable allocation event evidence.
      security:
        - AdminSession: []
      parameters:
        - name: X-Request-ID
          in: header
          required: false
