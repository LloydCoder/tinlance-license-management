name: CI

on:
  push:
    branches:
      - main
      - "chore/**"
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_cpanel_artifact:
        description: "Upload the verified cPanel package as a temporary Actions artifact; this does not create a public release."
        required: false
        type: boolean
        default: false
      release_version:
        description: "Release version string used only when publish_cpanel_artifact is enabled."
        required: false
        type: string
        default: "0.0.0-dev"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation governance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate required project documents
        shell: bash
        run: bash scripts/ci/check-docs.sh

  openapi:
    name: OpenAPI contract validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Validate OpenAPI 3.1.1 contract
        run: npx --yes @redocly/cli@1.34.24 lint docs/api/openapi.yaml --extends=spec --format=github-actions

  php-laravel:
    name: PHP and Laravel tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, pdo_mysql, pdo_sqlite
          coverage: none
          tools: composer:v2
      - name: Validate Composer manifest and lock
        run: composer validate --strict
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction
      - name: Lint application and domain PHP
        run: find app bootstrap config public routes src tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Enforce Laravel Pint formatting
        run: composer format:check
      - name: Run framework-independent domain tests
        run: composer test
      - name: Run Laravel feature tests
        run: composer test:framework
      - name: Verify Artisan bootstrap
        run: php artisan about --only=environment

  mysql-84-integration:
    name: MySQL 8.4 integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: tlms_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: false
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: tlms_test
      DB_USERNAME: root
      DB_PASSWORD: root
      TLMS_EXPECTED_DB_CONNECTION: mysql
      TLMS_EXPECTED_DB_VENDOR: mysql
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          extensions: intl, pdo_mysql
          coverage: none
          tools: composer:v2
      - name: Validate Composer manifest and lock
        run: composer validate --strict
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction
      - name: Enforce Laravel Pint formatting
        run: composer format:check
      - name: Run migrations and identity feature tests against MySQL 8.4
        run: composer test:framework

  mariadb-1011-integration:
    name: MariaDB 10.11 integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:10.11@sha256:d769e37960821dfdcf096954f6e7ac89f747e116c1bba98e48edd265dfc7deae
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_ROOT_HOST: "%"
          MARIADB_DATABASE: tlms_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: false
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: tlms_test
      DB_USERNAME: root
      DB_PASSWORD: root
      TLMS_EXPECTED_DB_CONNECTION: mysql
      TLMS_EXPECTED_DB_VENDOR: mariadb
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          extensions: intl, pdo_mysql
          coverage: none
          tools: composer:v2
      - name: Validate Composer manifest and lock
        run: composer validate --strict
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction
      - name: Enforce Laravel Pint formatting
        run: composer format:check
      - name: Run migrations and identity feature tests against MariaDB 10.11
        run: composer test:framework

  cpanel-release-artifact:
    name: cPanel production artifact verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          extensions: intl, pdo_mysql, pdo_sqlite
          coverage: none
          tools: composer:2.11.2
      - name: Verify production package contents and dependency exclusion
        run: bash scripts/ci/verify-cpanel-release-artifact.sh
      - name: Build package for explicit manual retrieval
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_cpanel_artifact == true
        env:
          TLMS_RELEASE_VERSION: ${{ inputs.release_version }}
        run: bash scripts/release/build-cpanel-artifact.sh
      - name: Upload temporary cPanel package artifact
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_cpanel_artifact == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tlms-cpanel-${{ inputs.release_version }}-${{ github.sha }}
          path: dist/*.zip*
          if-no-files-found: error
          retention-days: 7
