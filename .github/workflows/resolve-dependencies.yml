name: Resolve Composer dependencies

on:
  push:
    branches:
      - resolve-dependencies

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve and audit Fortify dependencies
    if: ${{ !contains(github.event.head_commit.message, '[skip dependency resolver]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout resolver branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          extensions: intl, mbstring, openssl, pdo_mysql, sodium, gmp
          coverage: none
          tools: composer:2.11.2
      - name: Set up the pinned Node toolchain\n        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0\n        with:\n          node-version: \"22.16.0\"\n      - name: Resolve locked authentication dependencies without running package scripts or plugins
        run: composer update laravel/fortify laravel/passkeys --with-dependencies --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins
      - name: Validate Composer manifest and lock
        run: composer validate --strict
      - name: Audit the resolved dependency graph
        run: composer audit --locked --no-interaction
      - name: Record resolved package versions
        run: |
          composer show --locked laravel/fortify
          composer show --locked laravel/passkeys
          composer show --locked web-auth/webauthn-lib
          composer show --locked pragmarx/google2fa
      - name: Generate the npm lockfile without executing dependency scripts\n        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund\n      - name: Install locked browser dependencies\n        run: npm ci --ignore-scripts --no-audit --no-fund\n      - name: Audit browser dependencies\n        run: npm audit --audit-level=high\n      - name: Build and verify the local passkeys browser bundle\n        run: |\n          npm run build\n          test -s public/build/passkeys.js\n      - name: Commit the generated lockfiles to this isolated resolver branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          git diff --exit-code -- composer.json package.json
          git add composer.lock package-lock.json
          if git diff --cached --quiet; then
            echo "Composer lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: lock Fortify and passkeys dependencies [skip dependency resolver]"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF}"
