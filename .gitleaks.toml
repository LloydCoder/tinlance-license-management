title = "TLMS secret scanning configuration"
minVersion = "8.25.0"

[extend]
useDefault = true

[[allowlists]]
description = "One exact synthetic password fixture in a historical authentication test; scoped to that value, file path and generic-api-key rule only."
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "secret"
paths = ['''(^|/)tests/Feature/AuthenticationFoundationTest\.php$''']
regexes = ['''A-long-test-passphrase-123''']
