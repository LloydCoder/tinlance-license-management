title = "TLMS secret scanning configuration"

[extend]
useDefault = true

[[allowlists]]
description = "A known non-secret password fixture from historical authentication tests; narrowly scoped to that exact literal, test file, and generic-api-key rule."
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "line"
paths = ['''tests/Feature/AuthenticationFoundationTest\.php$''']
regexes = ['''Correct-Horse-Battery-2026!''']
